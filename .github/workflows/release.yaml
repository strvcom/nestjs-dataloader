name: release
run-name: Release npm package ${{ inputs.channel }}

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: "The npm dist-tag to publish to (default: `latest`)"
        default: latest
        options:
          - latest
          - next

jobs:
  release:
    permissions:
      contents: write
      id-token: write

    name: npm release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: make compile
      - run: npm publish --tag ${{ inputs.channel }} --provenance
